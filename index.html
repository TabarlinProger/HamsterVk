<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Сортируй Плитки: Тапай и Играй</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/Icon.png">
  <link rel="apple-touch-icon" href="assets/Icon.png">
  <link rel="stylesheet" href="css/style.css?v=20260811-mobile-field-center">
</head>
<body class="loading">

  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="game-hud" class="hidden">
    <!-- Left: pause (top), hint (below) -->
    <button class="btn btn-icon btn-pause" id="btn-pause"><img src="assets/home.png" alt=""></button>
    <button class="btn btn-icon" id="btn-hint"><img src="assets/hint.png" alt=""><span id="hud-hint-count"></span></button>
    <!-- Right: hearts (top, centered with pause), counter, timer -->
    <div id="hud-lives" class="hud-hearts"></div>
    <div class="hud-counter">
      <img src="assets/Count.png" id="hud-counter-img" alt="">
      <span id="hud-remaining">0</span>
    </div>
    <div id="hud-timer" class="hud-timer hidden">
      <span id="hud-time">0:00</span>
    </div>
  </div>

  <!-- Главное меню -->
  <div id="main-menu" class="screen">
    <button class="btn" id="btn-continue"><img src="assets/play.png" alt=""><span data-i18n="continue">Продолжить</span></button>
    <button class="btn" id="btn-levels"><img src="assets/star.png" alt=""><span data-i18n="levels">Уровни</span></button>
    <button class="btn" id="btn-leaderboard"><img src="assets/Leaderboard.png" id="leaderboard-img" alt=""><span data-i18n="leaderboard">Лидеры</span></button>
    <button class="btn" id="btn-settings"><img src="assets/setting.png" alt=""><span data-i18n="settings">Настройки</span></button>
  </div>

  <!-- Выбор уровня -->
  <div id="level-select" class="screen hidden screen-overlay">
    <div id="chapters-carousel"></div>
    <button class="btn-back" id="btn-level-select-menu"><img src="assets/undo.png" alt=""><span data-i18n="backNav">Назад</span></button>
    <div id="levels-view" class="hidden">
      <div id="levels-grid"></div>
    </div>
  </div>

  <!-- Пауза -->
  <div id="pause-screen" class="screen hidden screen-overlay">
    <div class="panel">
      <h2 data-i18n="pauseTitle">Пауза</h2>
      <button class="btn btn-primary" id="btn-resume"><img src="assets/play.png" alt=""><span data-i18n="resume">Продолжить</span></button>
      <button class="btn" id="btn-pause-restart"><img src="assets/restart.png" alt=""><span data-i18n="restart">Заново</span></button>
      <button class="btn" id="btn-pause-menu"><img src="assets/home.png" alt=""><span data-i18n="back">В меню</span></button>
    </div>
  </div>

  <!-- Победа -->
  <div id="win-screen" class="screen hidden screen-overlay">
    <div class="panel">
      <h2 data-i18n="winTitle">Все хомяки спасены!</h2>
      <p id="win-level-text"></p>
      <div id="win-stars"></div>
      <div id="win-moves"></div>
      <button class="btn btn-success" id="btn-next-level"><img src="assets/play.png" alt=""><span data-i18n="next">Дальше</span></button>
      <button class="btn" id="btn-win-menu"><img src="assets/home.png" alt=""><span data-i18n="back">В меню</span></button>
    </div>
  </div>

  <!-- Софтлок -->
  <div id="softlock-screen" class="screen hidden screen-overlay">
    <div class="panel">
      <h2 data-i18n="softlockTitle">Нет ходов</h2>
      <p data-i18n="softlockText">Хомяки заблокированы</p>
      <button class="btn btn-warning hidden" id="btn-softlock-skip"><img src="assets/Ads.png" alt=""><span data-i18n="skipAd">Пропустить</span></button>
      <button class="btn btn-success" id="btn-softlock-ad"><img src="assets/Ads.png" alt=""><span data-i18n="returnAd">Вернуться</span></button>
      <button class="btn" id="btn-softlock-restart"><img src="assets/restart.png" alt=""><span data-i18n="restart">Заново</span></button>
      <button class="btn" id="btn-softlock-menu"><img src="assets/home.png" alt=""><span data-i18n="back">В меню</span></button>
    </div>
  </div>

  <!-- Подсказки закончились -->
  <div id="hint-ad-screen" class="screen hidden screen-overlay">
    <div class="panel">
      <h2 data-i18n="hintsTitle">Подсказки кончились</h2>
      <p data-i18n="hintsText" style="text-align:center;">Посмотреть рекламу и получить 3 подсказки?</p>
      <div style="display:flex;gap:16px;width:100%;">
        <button class="btn" id="btn-hint-ad-no" style="min-width:unset;flex:1;padding:8px 16px;" data-i18n="no">Нет</button>
        <button class="btn btn-success" id="btn-hint-ad-yes" style="min-width:unset;flex:1;padding:8px 16px;display:flex;flex-direction:row;align-items:center;gap:8px;">
          <img src="assets/Ads.png" style="width:40px;height:40px;" alt="">
          <span data-i18n="watch">Смотреть</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Настройки -->
  <div id="settings-screen" class="screen hidden screen-overlay">
    <button class="btn-back settings-back-mobile" id="btn-settings-back-mobile"><img src="assets/undo.png" alt=""><span data-i18n="backNav">Назад</span></button>
    <div class="panel">
      <h2 data-i18n="settings">Настройки</h2>
      <div style="display:flex;gap:16px;width:100%;justify-content:center;">
        <button class="btn lang-btn" id="btn-lang-ru" style="min-width:unset;padding:8px;border-radius:16px;"><img src="assets/Ru.png" style="width:80px;height:80px;display:block;" alt="RU"></button>
        <button class="btn lang-btn" id="btn-lang-en" style="min-width:unset;padding:8px;border-radius:16px;"><img src="assets/Eng.png" style="width:80px;height:80px;display:block;" alt="EN"></button>
      </div>
      <div style="display:flex;align-items:center;gap:16px;width:100%;justify-content:center;">
        <span style="font-size:24px;font-weight:700;" data-i18n="music">Звуки</span>
        <button class="btn" id="btn-music-toggle" style="min-width:unset;padding:16px 32px;" data-i18n="musicOn">Вкл</button>
      </div>
      <label class="settings-slider">
        <span data-i18n="musicVolume">Музыка</span>
        <input type="range" id="music-volume-slider" min="0" max="0.4" step="0.01" value="0.2">
      </label>
      <button class="btn-back" id="btn-settings-back"><img src="assets/undo.png" alt=""><span data-i18n="backNav">Назад</span></button>
    </div>
  </div>

  <!-- Таблица лидеров -->
  <div id="leaderboard-screen" class="screen hidden screen-overlay">
    <button class="btn-back" id="btn-leader-back"><img src="assets/undo.png" alt=""><span data-i18n="backNav">Назад</span></button>
    <div class="leader-panel">
      <h2 data-i18n="leaderTitle">Таблица лидеров</h2>
      <p class="leader-sub" data-i18n="leaderSub">Проходи уровни на 3 звезды, чтобы выйти в лидеры</p>
      <div id="leader-entries" class="leader-entries"></div>
      <div id="leader-player" class="leader-player hidden"></div>
    </div>
  </div>

  <!-- Обучение -->
  <div id="tutorial-screen" class="screen hidden screen-overlay">
    <div class="tutorial-panel">
      <h2 id="tutorial-title"></h2>
      <div class="tutorial-visual-wrap">
        <canvas id="tutorial-canvas"></canvas>
      </div>
      <p id="tutorial-text"></p>
      <button class="btn btn-primary" id="btn-tutorial-gotit" data-i18n="gotit">Понятно!</button>
    </div>
  </div>

  <script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.9/dist/browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/levels.js?v=20260605-level61-pipes"></script>
  <script src="js/game-core.js?v=20260605-skip-button"></script>
  <script src="js/sprites.js"></script>
  <script src="js/renderer.js?v=20260811-mobile-field-center"></script>
  <script src="js/sound.js?v=20260624-menu-music"></script>
  <script src="js/input.js?v=20260816-vk-api"></script>
  <script src="js/locales.js?v=20260624-i18n-refresh"></script>
  <script src="js/main.js?v=20260816-vk-api"></script>

</body>
</html>
